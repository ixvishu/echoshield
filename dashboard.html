<html lang="en" class="dark" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoShield AI – Climate Resilience & Environmental Intelligence Platform</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Babel compiler for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
  /* ============================================
     THEME VARIABLES – data-theme="dark" / "light"
     Applied via JavaScript on <html> element
     ============================================ */
  :root {
    /* Dark mode defaults */
    --bg-base:        #080d15;
    --bg-surface:     #0f172a;
    --bg-card:        #111827;
    --bg-overlay:     rgba(8,13,24,0.7);
    --bg-nav:         #0b1120;
    --bg-header:      rgba(3,7,18,0.85);
    --bg-input:       rgba(11,15,23,0.8);
    --bg-bulletin:    #020508;
    --bg-chip:        #1e293b;

    --border-base:    rgba(255,255,255,0.08);
    --border-muted:   rgba(255,255,255,0.05);
    --border-subtle:  #1e293b;

    --text-primary:   #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted:     #64748b;
    --text-heading:   #ffffff;

    --shadow-card:    0 20px 50px rgba(0,0,0,0.4);
    --chat-ai-bg:     #1e293b;
    --chat-ai-border: #334155;

    --scroll-thumb:   rgba(255,255,255,0.12);
    --scroll-track:   transparent;

    --wave-bg:        #111827;
    --nav-active-bg:  rgba(30,41,59,0.8);
    --sidebar-text:   #94a3b8;
  }

  html[data-theme="light"] {
    --bg-base:        #f1f5f9;
    --bg-surface:     #ffffff;
    --bg-card:        #ffffff;
    --bg-overlay:     rgba(255,255,255,0.85);
    --bg-nav:         #ffffff;
    --bg-header:      rgba(255,255,255,0.95);
    --bg-input:       #ffffff;
    --bg-bulletin:    #1e3a5f;
    --bg-chip:        #e2e8f0;

    --border-base:    #cbd5e1;
    --border-muted:   #e2e8f0;
    --border-subtle:  #e2e8f0;

    --text-primary:   #0f172a;
    --text-secondary: #475569;
    --text-muted:     #64748b;
    --text-heading:   #0f172a;

    --shadow-card:    0 4px 24px rgba(0,0,0,0.08);
    --chat-ai-bg:     #f8fafc;
    --chat-ai-border: #e2e8f0;

    --scroll-thumb:   rgba(0,0,0,0.15);
    --scroll-track:   rgba(0,0,0,0.02);

    --wave-bg:        #e0f2fe;
    --nav-active-bg:  #eff6ff;
    --sidebar-text:   #374151;
  }

  /* ============================================
     APPLY THEME VARIABLES TO ELEMENTS
     ============================================ */
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-base) !important;
    color: var(--text-primary) !important;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  h1, h2, h3, h4, .font-display {
    font-family: 'Outfit', sans-serif;
    color: var(--text-heading);
  }

  /* Live bulletin banner */
  .theme-bulletin {
    background-color: var(--bg-bulletin) !important;
  }

  /* All panel/card surfaces */
  .theme-surface {
    background-color: var(--bg-surface) !important;
    border-color: var(--border-base) !important;
    color: var(--text-primary) !important;
  }
  .theme-card {
    background-color: var(--bg-card) !important;
    border-color: var(--border-base) !important;
    color: var(--text-primary) !important;
    box-shadow: var(--shadow-card) !important;
  }
  .theme-overlay {
    background: var(--bg-overlay) !important;
    border-color: var(--border-base) !important;
  }
  .theme-header {
    background: var(--bg-header) !important;
    border-color: var(--border-subtle) !important;
    backdrop-filter: blur(12px);
  }
  .theme-nav {
    background-color: var(--bg-nav) !important;
    border-color: var(--border-subtle) !important;
  }
  .theme-input {
    background-color: var(--bg-input) !important;
    color: var(--text-primary) !important;
    border-color: var(--border-base) !important;
  }
  .theme-input::placeholder {
    color: var(--text-muted) !important;
  }
  .theme-chip {
    background-color: var(--bg-chip) !important;
    border-color: var(--border-subtle) !important;
    color: var(--text-secondary) !important;
  }
  .theme-text-primary   { color: var(--text-primary)   !important; }
  .theme-text-secondary { color: var(--text-secondary) !important; }
  .theme-text-muted     { color: var(--text-muted)     !important; }
  .theme-border         { border-color: var(--border-base)   !important; }
  .theme-border-subtle  { border-color: var(--border-subtle) !important; }

  .theme-nav-active {
    background-color: var(--nav-active-bg) !important;
  }
  .theme-sidebar-text {
    color: var(--sidebar-text) !important;
  }

  /* Chat panel */
  .theme-chat-window {
    background-color: var(--bg-surface) !important;
    border-color: var(--border-base) !important;
  }
  .theme-chat-header {
    background-color: var(--bg-nav) !important;
    border-color: var(--border-subtle) !important;
  }
  .theme-chat-ai-bubble {
    background-color: var(--chat-ai-bg) !important;
    border-color: var(--chat-ai-border) !important;
    color: var(--text-secondary) !important;
  }
  .theme-chat-input-bar {
    background-color: var(--bg-nav) !important;
    border-color: var(--border-subtle) !important;
  }
  .theme-chat-input {
    background-color: var(--bg-chip) !important;
    color: var(--text-primary) !important;
    border-color: var(--border-base) !important;
  }
  .theme-chat-input::placeholder {
    color: var(--text-muted) !important;
  }

  /* Water wave */
  .water-wave {
    position: relative;
    width: 80px; height: 80px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #2563eb;
    background: var(--wave-bg);
    transition: background 0.25s;
  }
  .water-wave .liquid {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    background: #2563eb;
    border-radius: 50%;
    transition: top 0.5s ease-in-out;
  }
  .water-wave .liquid::before,
  .water-wave .liquid::after {
    content: '';
    position: absolute;
    width: 200%; height: 200%;
    top: -150%; left: -50%;
    background: var(--wave-bg);
    border-radius: 45%;
    animation: wave 12s linear infinite;
  }
  .water-wave .liquid::after {
    background: rgba(37,99,235,0.4);
    border-radius: 40%;
    animation: wave 18s linear infinite;
    top: -145%;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--scroll-track); }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }

  /* Grid background */
  .grid-bg {
    background-size: 50px 50px;
  }
  html[data-theme="dark"] .grid-bg {
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
  }
  html[data-theme="light"] .grid-bg {
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
  }

  /* Glow orbs – subdued in light mode */
  .glow-orb {
    position: absolute; border-radius: 50%;
    filter: blur(140px); pointer-events: none; z-index: 0;
  }
  html[data-theme="dark"]  .glow-orb { opacity: 0.45; mix-blend-mode: screen; }
  html[data-theme="light"] .glow-orb { opacity: 0.08; mix-blend-mode: multiply; }

  .glow-blue    { background: radial-gradient(circle,#3b82f6 0%,rgba(59,130,246,0) 70%);   width:600px;height:600px; }
  .glow-indigo  { background: radial-gradient(circle,#6366f1 0%,rgba(99,102,241,0) 70%);   width:500px;height:500px; }
  .glow-emerald { background: radial-gradient(circle,#10b981 0%,rgba(16,185,129,0) 70%);   width:450px;height:450px; }
  .glow-purple  { background: radial-gradient(circle,#8b5cf6 0%,rgba(139,92,246,0) 70%);   width:500px;height:500px; }

  /* Marquee / glass card */
  @keyframes wave      { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
  @keyframes marquee   { 0%{transform:translate3d(0,0,0)} 100%{transform:translate3d(-50%,0,0)} }
  @keyframes pulse-slow{ 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:.55;transform:scale(1.1)} }
  @keyframes blink     { 50%{opacity:0} }

  .animate-marquee  { display:flex; width:max-content; animation:marquee 35s linear infinite; }
  .animate-pulse-slow { animation:pulse-slow 8s infinite ease-in-out; }
  .cursor-blink     { animation:blink 1s step-end infinite; }

  .glass-card {
    background: var(--bg-overlay);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-base);
    box-shadow: var(--shadow-card);
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .glass-card:hover { border-color: var(--border-muted); }

  /* Scrollbar thin */
  .scrollbar-thin::-webkit-scrollbar       { width:4px; }
  .scrollbar-thin::-webkit-scrollbar-track { background:transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background:var(--scroll-thumb); border-radius:2px; }

  /* Dark mode live bulletin text (stay bright) */
  html[data-theme="dark"] .bulletin-text { color: #cbd5e1; }
  html[data-theme="light"] .bulletin-text { color: #1e3a5f; }
  html[data-theme="light"] .bulletin-label {
    background: rgba(37,99,235,0.15) !important;
    border-color: rgba(37,99,235,0.3) !important;
    color: #1d4ed8 !important;
  }
  html[data-theme="light"] .bulletin-label .bulletin-dot {
    background-color: #2563eb !important;
  }

  /* ============================================
     LIGHT MODE – Blanket Tailwind overrides
     Catches any slate/dark Tailwind classes still
     used in JSX that we couldn't individually fix
     ============================================ */
  html[data-theme="light"] body,
  html[data-theme="light"] #root,
  html[data-theme="light"] #root > * {
    background-color: var(--bg-base);
    color: var(--text-primary);
  }

  /* All remaining dark bg classes → light surfaces */
  html[data-theme="light"] [class*="bg-slate-8"],
  html[data-theme="light"] [class*="bg-slate-9"],
  html[data-theme="light"] [class*="bg-[#0"],
  html[data-theme="light"] [class*="bg-[#1"] {
    background-color: var(--bg-card) !important;
    color: var(--text-primary) !important;
  }

  /* Text colors that look washed out on light backgrounds */
  html[data-theme="light"] [class*="text-slate-1"],
  html[data-theme="light"] [class*="text-white"] {
    color: var(--text-primary) !important;
  }
  html[data-theme="light"] [class*="text-slate-2"],
  html[data-theme="light"] [class*="text-slate-3"] {
    color: var(--text-secondary) !important;
  }
  html[data-theme="light"] [class*="text-slate-4"],
  html[data-theme="light"] [class*="text-slate-5"],
  html[data-theme="light"] [class*="text-slate-6"] {
    color: var(--text-muted) !important;
  }

  /* Dark borders → light borders */
  html[data-theme="light"] [class*="border-slate-8"],
  html[data-theme="light"] [class*="border-slate-9"] {
    border-color: var(--border-base) !important;
  }

  /* Inputs / selects / textareas */
  html[data-theme="light"] input:not([type="range"]),
  html[data-theme="light"] select,
  html[data-theme="light"] textarea {
    background-color: var(--bg-input) !important;
    color: var(--text-primary) !important;
    border-color: var(--border-base) !important;
  }
  html[data-theme="light"] input::placeholder,
  html[data-theme="light"] textarea::placeholder {
    color: var(--text-muted) !important;
  }
  html[data-theme="light"] option {
    background-color: #ffffff;
    color: #0f172a;
  }

  /* KPI / data cards */
  html[data-theme="light"] .glass-card,
  html[data-theme="light"] .theme-card,
  html[data-theme="light"] .theme-surface {
    box-shadow: 0 2px 16px rgba(0,0,0,0.07) !important;
  }

  /* Preserve accent colors (don't over-ride cyan/blue/emerald/amber/red) */
  html[data-theme="light"] .text-cyan-400,
  html[data-theme="light"] .text-cyan-450,
  html[data-theme="light"] .text-cyan-400 { color: #0891b2 !important; }
  html[data-theme="light"] .text-cyan-400  { color: #2563eb !important; }
  html[data-theme="light"] .text-cyan-400,
  html[data-theme="light"] .text-emerald-500 { color: #059669 !important; }
  html[data-theme="light"] .text-amber-400,
  html[data-theme="light"] .text-amber-500 { color: #d97706 !important; }
  html[data-theme="light"] .text-red-400   { color: #dc2626 !important; }
  html[data-theme="light"] .text-purple-400 { color: #7c3aed !important; }

  /* Animations */
  @keyframes fade-in-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slide-in-right {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  
  .animate-fade-in-up { animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
  .animate-fade-in { animation: fade-in 0.8s ease-out forwards; opacity: 0; }
  .animate-slide-in-right { animation: slide-in-right 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
  
  .delay-100 { animation-delay: 100ms; }
  .delay-200 { animation-delay: 200ms; }
  .delay-300 { animation-delay: 300ms; }
  .delay-400 { animation-delay: 400ms; }
  .delay-500 { animation-delay: 500ms; }
  
  .hover-scale { transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .hover-scale:hover { transform: translateY(-2px) scale(1.01); }
  </style>


  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            consoleBgLight: '#f1f5f9',
            consoleBgDark: '#0b0f17',
            consoleNavDark: '#0f172a',
            gcpBlue: '#1a73e8',

            borderDark: '#1f2937',
            cardLight: '#ffffff',
            cardDark: '#111827'
          }
        }
      }
    }
  </script>
</head>
<body>
  
  <div id="root"></div>

  <!-- React Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_REPORTS = [
      { id: "REP-104", name: "Srinivas Gowda", phone: "+91 94480 12345", type: "Flood", location: "Silk Board Junction (Monsoon Waterlogging)", lat: 12.917, lng: 77.623, desc: "Monsoon drain overflow. Waterlogging up to 2 feet on Service Road, stalling cars.", status: "Pending", time: "10 mins ago", image: "https://images.unsplash.com/photo-1547683905-f686c993aae5?auto=format&fit=crop&w=300&q=80" },
      { id: "REP-103", name: "Priya Nair", phone: "+91 98860 55443", type: "Tree Fall", location: "100 Feet Road, Indiranagar", lat: 12.964, lng: 77.640, desc: "A massive Gulmohar tree has fallen onto parked vehicles, blocking two lanes.", status: "Verified", time: "25 mins ago", image: "https://images.unsplash.com/photo-1594756297462-ec7a6c9d747a?auto=format&fit=crop&w=300&q=80" },
      { id: "REP-102", name: "Karthik Subramanian", phone: "+91 70123 99887", type: "Water Leakage", location: "Whitefield Outer Ring Road", lat: 12.969, lng: 77.749, desc: "Major BWSSB pipeline fracture, discharging potable water onto the road.", status: "Assigned", time: "1 hour ago", image: "https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=300&q=80" },
      { id: "REP-101", name: "Dr. Sandeep Sen", phone: "+91 80234 56789", type: "Pollution", location: "Bellandur Lake (Chemical Foaming)", lat: 12.934, lng: 77.671, desc: "Severe chemical foaming observed along the north channels of the lake.", status: "Resolved", time: "3 hours ago", image: "https://images.unsplash.com/photo-1618477388954-7852f32655ec?auto=format&fit=crop&w=300&q=80" },
    ];

    const EMERGENCY_RESOURCES = [
      { id: "RES-01", name: "BBMP Disaster Cell Team A", type: "Rescue Team", status: "Active", location: "Silk Board Junction", lat: 12.919, lng: 77.620, contact: "Supervisor Srinivas" },
      { id: "RES-02", name: "SDRF Water Rescue Squad", type: "Rescue Team", status: "Standby", location: "Bellandur Outpost", lat: 12.935, lng: 77.665, contact: "Officer Manjunath" },
      { id: "RES-03", name: "HAL Emergency Ambulance", type: "Ambulance", status: "Active", location: "HAL Airport Road Hospital", lat: 12.956, lng: 77.652, contact: "Paramedic Vinod" },
      { id: "RES-04", name: "Hebbal Relief Shelter 1", type: "Shelter", status: "Open (120/400)", location: "Hebbal Ground", lat: 13.035, lng: 77.597, contact: "Coordinator Murthy" },
      { id: "RES-05", name: "BBMP Fire Station Central", type: "Fire Station", status: "Standby", location: "MG Road Station", lat: 12.975, lng: 77.608, contact: "Station Chief Kumar" },
    ];

    function App() {
      // Auth states
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [isDemoConnecting, setIsDemoConnecting] = useState(false);
      const [introTab, setIntroTab] = useState("login"); // "login" or "report"

      // Public citizen reporting form states
      const [publicName, setPublicName] = useState("");
      const [publicPhone, setPublicPhone] = useState("");
      const [publicType, setPublicType] = useState("Flood");
      const [publicLocation, setPublicLocation] = useState("");
      const [publicDesc, setPublicDesc] = useState("");
      const [publicSuccess, setPublicSuccess] = useState("");

      // Intro telemetry simulation logs
      const [telemetryLogs, setTelemetryLogs] = useState([
        { id: 1, text: "GCP Telemetry stream linked successfully.", time: "10:45:12" },
        { id: 2, text: "Sensor Node S-101 (Silk Board PM2.5): 165 AQI (Normal variance).", time: "10:46:01" },
        { id: 3, text: "GisMap layer loaded: 3 raster overlays cached.", time: "10:46:18" },
        { id: 4, text: "Bellandur lake level telemetry verified at 12.4m.", time: "10:47:02" },
      ]);

      // Telemetry log updates (Intro page only)
      useEffect(() => {
        if (isLoggedIn) return;
        const interval = setInterval(() => {
          const msgs = [
            "Sensor Node S-102 (Bellandur Lake) level stabilized at 12.4m",
            "TG Halli reservoir level telemetry tick: 28.5%",
            "AQI reading update: 168 (Peenya Industrial)",
            "Weather API response: Temp 31.2°C, Humidity 68%",
            "SMS/EWS broadcast system ready on channels 1-4",
            "Leaflet map tiles successfully synchronized from CartoDB",
            "GCP BigQuery cluster ingestion: 120 events/sec ingested"
          ];
          const randomMsg = msgs[Math.floor(Math.random() * msgs.length)];
          const now = new Date();
          const timeStr = now.toTimeString().split(' ')[0];
          setTelemetryLogs(prev => [
            { id: Date.now(), text: randomMsg, time: timeStr },
            ...prev.slice(0, 3)
          ]);
        }, 3000);
        return () => clearInterval(interval);
      }, [isLoggedIn]);

      // Sleek automatic typewriter demo login simulation
      const handleDemoLogin = () => {
        if (isDemoConnecting) return;
        setIsDemoConnecting(true);
        setError("");
        
        const targetEmail = "admin@ecoshield.gov.in";
        const targetPassword = "admin";
        
        let currentEmail = "";
        let emailIdx = 0;
        
        const typeEmailInterval = setInterval(() => {
          if (emailIdx < targetEmail.length) {
            currentEmail += targetEmail[emailIdx];
            setEmail(currentEmail);
            emailIdx++;
          } else {
            clearInterval(typeEmailInterval);
            
            // Short pause, then type password
            setTimeout(() => {
              let currentPassword = "";
              let passIdx = 0;
              const typePassInterval = setInterval(() => {
                if (passIdx < targetPassword.length) {
                  currentPassword += targetPassword[passIdx];
                  setPassword(currentPassword);
                  passIdx++;
                } else {
                  clearInterval(typePassInterval);
                  
                  // Authenticating spinner
                  setTimeout(() => {
                    setIsLoggedIn(true);
                    setIsDemoConnecting(false);
                  }, 600);
                }
              }, 60);
            }, 200);
          }
        }, 30);
      };

      // App core states
      const [activeTab, setActiveTab] = useState("dashboard");
      const [reports, setReports] = useState(INITIAL_REPORTS);
      const [resources, setResources] = useState(EMERGENCY_RESOURCES);
      const [darkMode, setDarkMode] = useState(true);
      const [notifications, setNotifications] = useState([
        { id: 1, text: "Urban flood warning issued for Outer Ring Road (ORR) Bellandur stretch.", type: "danger", time: "Just now" },
        { id: 2, text: "Air Quality Index (AQI) exceeded 240 in Peenya Industrial Area.", type: "warning", time: "1 hour ago" },
        { id: 3, text: "Sensor Node S-403: Tippagondanahalli reservoir depletion warning (capacity < 30%).", type: "info", time: "2 hours ago" }

          };

            const cs = window.getComputedStyle(el);
            const bg = cs.backgroundColor;
            if (bgMap[bg] !== undefined) {

                              <th className="p-2">Value</th>
                              <th className="p-2">Threshold Limits</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr className="border-b border-slate-100">
                              <td className="p-2 font-mono">Bellandur Node S-401</td>
                              <td className="p-2">Lake Depth</td>
                              <td className="p-2 font-mono">{riverLevel}m</td>
                              <td className="p-2 text-red-600 font-mono">14.50m</td>
                            </tr>
                            <tr className="border-b border-slate-100">
                              <td className="p-2 font-mono">Silk Board Node S-402</td>
                              <td className="p-2">AQI Grid</td>
                              <td className="p-2 font-mono">{sensorAqi} AQI</td>
                              <td className="p-2 text-red-650 font-mono">200 AQI</td>
                            </tr>
                            <tr>
                              <td className="p-2 font-mono">TG Halli Node S-403</td>
                              <td className="p-2">Water Reserves</td>
                              <td className="p-2 font-mono">{reservoirCapacity.toFixed(1)}%</td>
                              <td className="p-2 text-red-600 font-mono">30% (Critical)</td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
            {renderAiChatAssistant()}
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
